<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Obsidian Capture</title>
        <link rel="manifest" href="manifest.json">
          <meta name="theme-color" content="#1e1e1e">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
            <style>
                :root {
                      --bg: #1e1e1e;
                            --surface: #2d2d2d;
                                  --primary: #7d5cf5;
                                        --text: #e0e0e0;
                                              --text-muted: #a0a0a0;
                                                    --border: #404040;
                                                        }
                                                            * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                                                                body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
                                                                    
                                                                        header { background: var(--surface); padding: 15px 20px; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;}
                                                                            .status { font-size: 0.8rem; color: var(--text-muted); align-self: center; }
                                                                                
                                                                                    main { flex: 1; overflow-y: auto; padding: 20px; }
                                                                                        
                                                                                            input, textarea { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 16px; outline: none; }
                                                                                                textarea { height: 200px; resize: none; }
                                                                                                    input:focus, textarea:focus { border-color: var(--primary); }
                                                                                                        
                                                                                                            button { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px;}
                                                                                                                button:active { opacity: 0.8; }
                                                                                                                    
                                                                                                                        nav { display: flex; background: var(--surface); border-top: 1px solid var(--border); }
                                                                                                                            nav button { flex: 1; border-radius: 0; background: transparent; color: var(--text-muted); margin: 0; padding: 15px; border-bottom: 3px solid transparent; }
                                                                                                                                nav button.active { color: var(--primary); border-bottom-color: var(--primary); }

                                                                                                                                    .hidden { display: none !important; }
                                                                                                                                        .note-card { background: var(--surface); padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid var(--border); }
                                                                                                                                            
                                                                                                                                                #toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; display: none; }
                                                                                                                                                    
                                                                                                                                                        /* Markdown Styles */
                                                                                                                                                            #note-viewer { background: var(--surface); padding: 20px; border-radius: 8px; min-height: 100%; }
                                                                                                                                                                #note-viewer h1, #note-viewer h2 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 5px;}
                                                                                                                                                                    #note-viewer pre { background: var(--bg); padding: 10px; overflow-x: auto; border-radius: 5px; }
                                                                                                                                                                      </style>
                                                                                                                                                                      </head>
                                                                                                                                                                      <body>

                                                                                                                                                                        <header>
                                                                                                                                                                            <span>Vault Capture</span>
                                                                                                                                                                                <span class="status" id="connection-status">Online</span>
                                                                                                                                                                                  </header>

                                                                                                                                                                                    <main>
                                                                                                                                                                                        <!-- SETUP SCREEN -->
                                                                                                                                                                                            <div id="setup-view" class="hidden">
                                                                                                                                                                                                  <h2>Settings</h2>
                                                                                                                                                                                                        <p style="color: var(--text-muted); font-size: 0.9rem;">Configure your GitHub repository.</p>
                                                                                                                                                                                                              <input type="text" id="gh-owner" placeholder="GitHub Username">
                                                                                                                                                                                                                    <input type="text" id="gh-repo" placeholder="Vault Repo Name">
                                                                                                                                                                                                                          <input type="password" id="gh-token" placeholder="Personal Access Token (PAT)">
                                                                                                                                                                                                                                <button onclick="saveConfig()">Save Settings</button>
                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                        <!-- CAPTURE SCREEN -->
                                                                                                                                                                                                                                            <div id="capture-view">
                                                                                                                                                                                                                                                  <input type="text" id="note-title" placeholder="Note Title (Optional)">
                                                                                                                                                                                                                                                        <textarea id="note-content" placeholder="Write your markdown here..."></textarea>
                                                                                                                                                                                                                                                              <button onclick="submitNote()">Save Note to Inbox</button>
                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                      <!-- INBOX SCREEN -->
                                                                                                                                                                                                                                                                          <div id="inbox-view" class="hidden">
                                                                                                                                                                                                                                                                                <button onclick="fetchInbox()" style="margin-bottom: 20px;">Refresh Inbox</button>
                                                                                                                                                                                                                                                                                      <div id="inbox-list"></div>
                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                              <!-- VIEWER SCREEN -->
                                                                                                                                                                                                                                                                                                  <div id="viewer-view" class="hidden">
                                                                                                                                                                                                                                                                                                        <button onclick="switchTab('inbox')" style="background: var(--surface); border: 1px solid var(--border); color: var(--text);">← Back</button>
                                                                                                                                                                                                                                                                                                              <div id="note-viewer"></div>
                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                      <!-- BOTTOM NAV -->
                                                                                                                                                                                                                                                                                                                        <nav id="bottom-nav">
                                                                                                                                                                                                                                                                                                                            <button id="tab-capture" class="active" onclick="switchTab('capture')">Capture</button>
                                                                                                                                                                                                                                                                                                                                <button id="tab-inbox" onclick="switchTab('inbox')">Inbox</button>
                                                                                                                                                                                                                                                                                                                                    <button id="tab-setup" onclick="switchTab('setup')">⚙️</button>
                                                                                                                                                                                                                                                                                                                                      </nav>

                                                                                                                                                                                                                                                                                                                                        <div id="toast">Saved!</div>

                                                                                                                                                                                                                                                                                                                                          <script type="module">
                                                                                                                                                                                                                                                                                                                                              import { marked } from './vendor/marked.esm.js';
                                                                                                                                                                                                                                                                                                                                                  import { get, set } from './vendor/idb-keyval.js';

                                                                                                                                                                                                                                                                                                                                                      // Register Service Worker
                                                                                                                                                                                                                                                                                                                                                          if ('serviceWorker' in navigator) {
                                                                                                                                                                                                                                                                                                                                                                navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {
                                                                                                                                                                                                                                                                                                                                                                      console.warn('Service worker registration failed.');
                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                        // App State
                                                                                                                                                                                                                                                                                                                                                                            let config = JSON.parse(localStorage.getItem('obsidian_config')) || null;

                                                                                                                                                                                                                                                                                                                                                                                // UI Utilities
                                                                                                                                                                                                                                                                                                                                                                                    window.switchTab = (tabId) => {
                                                                                                                                                                                                                                                                                                                                                                                          ['setup', 'capture', 'inbox', 'viewer'].forEach(id => {
                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById(`${id}-view`).classList.add('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById(`${tabId}-view`).classList.remove('hidden');
                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                          document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                if(document.getElementById(`tab-${tabId}`)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById(`tab-${tabId}`).classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                          if(tabId === 'inbox') fetchInbox();
                                                                                                                                                                                                                                                                                                                                                                                                                                                              };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const showToast = (msg) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const t = document.getElementById('toast');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              t.innerText = msg;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    t.style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          setTimeout(() => t.style.display = 'none', 3000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Encoding Utilities for GitHub API
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const utf8ToBase64 = (str) => btoa(Array.from(new TextEncoder().encode(str), byte => String.fromCodePoint(byte)).join(""));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const base64ToUtf8 = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64), m => m.codePointAt(0)));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // Setup Logic
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!config || !config.token) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        switchTab('setup');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                window.saveConfig = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      config = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              owner: document.getElementById('gh-owner').value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      repo: document.getElementById('gh-repo').value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              token: document.getElementById('gh-token').value.trim()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          localStorage.setItem('obsidian_config', JSON.stringify(config));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                showToast("Settings saved!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      switchTab('capture');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // Capture Logic
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  window.submitNote = async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let title = document.getElementById('note-title').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const content = document.getElementById('note-content').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!content) return showToast("Note is empty!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Auto-generate title if blank
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!title) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const date = new Date();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      title = `Note_${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}_${date.getHours()}${date.getMinutes()}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (navigator.onLine) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await pushToGitHub(`inbox/${title}.md`, content);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              showToast("Saved to GitHub!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                queueLocally(title, content);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      queueLocally(title, content);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('note-title').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('note-content').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const pushToGitHub = async (path, content) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`, {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              method: 'PUT',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      headers: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                'Authorization': `Bearer ${config.token}`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          'Accept': 'application/vnd.github+json',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    'Content-Type': 'application/json'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    body: JSON.stringify({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              message: `Mobile capture: ${path}`,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        content: utf8ToBase64(content)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!res.ok) throw new Error("GitHub API Error");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const queueLocally = async (title, content) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const queue = (await get('sync_queue')) || [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                queue.push({ path: `inbox/${title}.md`, content });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      await set('sync_queue', queue);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            showToast("Offline. Saved to local queue.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Sync Background Queue
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.addEventListener('online', async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('connection-status').innerText = 'Online';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('connection-status').style.color = 'var(--text-muted)';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const queue = await get('sync_queue');
